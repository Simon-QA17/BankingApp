name: Run tests from other repo
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # this repo

      - uses: actions/checkout@v4          # the other repo
        with:
          repository: Simon-QA17/Github_Actions_Manual
          path: Github_Actions_Manual
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -D @playwright/test
          npx playwright install chromium

      - name: Start Local Server
        # This serves your HTML file on port 8080 in the background
        run: npx serve . -l 8080 &

      - name: Run Playwright Tests
        run: npx playwright test
        working-directory: Github_Actions_Manual
